<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Terminal mark: white L + blue block cursor on the VS Code panel tile.
       All rectangles so it stays crisp at 16px with no font dependency. -->
  <rect width="64" height="64" rx="14" fill="#1e1e1e"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="17" y="15" width="8" height="33" fill="#ffffff"/>
  <rect x="17" y="40" width="18" height="8" fill="#ffffff"/>
  <rect x="39" y="30" width="10" height="18" fill="#008fff"/>
</svg>
